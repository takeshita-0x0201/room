<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Room macOS menu bar app preview</title>
  <desc id="description">Room showing memory pressure, storage usage, top processes, and Make Room actions.</desc>
  <defs>
    <radialGradient id="canvas" cx="72%" cy="45%" r="75%">
      <stop offset="0" stop-color="#dce5e9"/>
      <stop offset="0.48" stop-color="#f0f0ec"/>
      <stop offset="1" stop-color="#f8f6f1"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#39444a" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#39444a" flood-opacity=".12"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#39444a" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#canvas)"/>
  <circle cx="1040" cy="370" r="310" fill="none" stroke="#5d7f9f" stroke-opacity=".09"/>
  <circle cx="1040" cy="370" r="235" fill="none" stroke="#5d7f9f" stroke-opacity=".08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" fill="#171816">
    <text x="76" y="290" font-size="150" font-weight="700" letter-spacing="-8">Room</text>
    <text x="82" y="377" font-size="58" font-weight="650" letter-spacing="-2">See what's full.</text>
    <text x="82" y="445" font-size="58" font-weight="650" letter-spacing="-2" fill="#5d7f9f">Make room.</text>
    <text x="84" y="515" font-size="20" fill="#696b68">Memory pressure and storage, quietly in your menu bar.</text>
  </g>

  <g filter="url(#chipShadow)">
    <rect x="1000" y="32" width="290" height="64" rx="24" fill="#fffefa" fill-opacity=".94" stroke="#d8d7d1"/>
    <g transform="translate(1028 53)" fill="none" stroke="#5d7f9f" stroke-width="3">
      <rect width="24" height="23" rx="4"/>
      <path d="M5-5v5m7-5v5m7-5v5M5 23v5m7-5v5m7-5v5"/>
      <rect x="6" y="6" width="12" height="11" rx="2" stroke-width="2"/>
    </g>
    <text x="1066" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="650" fill="#455d73">72</text>
    <rect x="1124" y="47" width="1" height="34" fill="#d8d7d1"/>
    <g transform="translate(1149 52)" fill="none" stroke="#5c8974" stroke-width="3">
      <rect width="27" height="26" rx="6"/>
      <path d="M4 17h19"/>
      <circle cx="21" cy="22" r="1.5" fill="#5c8974" stroke="none"/>
    </g>
    <text x="1190" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="650" fill="#456957">68</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M790 148a20 20 0 0 1 20-20h194l18-18 18 18h274a20 20 0 0 1 20 20v548a20 20 0 0 1-20 20H810a20 20 0 0 1-20-20Z" fill="#fffefa" fill-opacity=".96" stroke="#d8d7d1"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" fill="#171816">
    <g transform="translate(824 157)" fill="none" stroke="#4e5350" stroke-width="2.4" stroke-linecap="round">
      <path d="M16 0 1 8v18l15 8 15-8V8Z"/>
      <path d="m1 8 15 8 15-8M16 16v18"/>
    </g>
    <text x="866" y="184" font-size="21" font-weight="650">Room</text>
    <circle cx="1244" cy="173" r="18" fill="#ecebe6"/>
    <g transform="translate(1244 173)" fill="none" stroke="#727773" stroke-width="2" stroke-linecap="round">
      <path d="M0-9v9M-6-6a9 9 0 1 0 12 0"/>
    </g>
    <circle cx="1288" cy="173" r="18" fill="#ecebe6"/>
    <g transform="translate(1288 173)" fill="none" stroke="#727773" stroke-width="2">
      <circle r="6"/><path d="M0-11v4M0 7v4M-11 0h4M7 0h4M-8-8l3 3M5 5l3 3M8-8 5-5M-5 5l-3 3"/>
    </g>
    <rect x="814" y="210" width="496" height="1" fill="#deddd7"/>

    <g transform="translate(824 240)" fill="none" stroke="#5d7f9f" stroke-width="2">
      <rect width="18" height="17" rx="3"/><path d="M4-4v4m5-4v4m5-4v4M4 17v4m5-4v4m5-4v4"/>
    </g>
    <text x="854" y="255" font-size="17">Memory</text>
    <text x="1288" y="255" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">72%</text>
    <rect x="824" y="273" width="464" height="6" rx="3" fill="#ecebe6"/>
    <rect x="824" y="273" width="334" height="6" rx="3" fill="#5d7f9f"/>
    <text x="824" y="307" font-size="15" font-weight="550">18.4 / 24 GB</text>
    <text x="1060" y="307" font-size="14" fill="#777975">Free</text>
    <text x="1288" y="307" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">5.6 GB</text>
    <text x="824" y="337" font-size="14" fill="#777975">Pressure</text>
    <circle cx="902" cy="332" r="5" fill="#5d7f9f"/>
    <text x="914" y="337" font-size="14">Normal</text>
    <text x="1060" y="337" font-size="14" fill="#777975">Swap</text>
    <text x="1288" y="337" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">768 MB</text>

    <rect x="814" y="365" width="496" height="1" fill="#deddd7"/>
    <g transform="translate(824 393)" fill="none" stroke="#5c8974" stroke-width="2">
      <rect width="19" height="18" rx="4"/><path d="M3 12h13"/><circle cx="15" cy="15" r="1" fill="#5c8974" stroke="none"/>
    </g>
    <text x="854" y="408" font-size="17">Storage</text>
    <text x="1288" y="408" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">68%</text>
    <rect x="824" y="426" width="464" height="6" rx="3" fill="#ecebe6"/>
    <rect x="824" y="426" width="316" height="6" rx="3" fill="#5c8974"/>
    <text x="824" y="460" font-size="15" font-weight="550">341 / 512 GB</text>
    <text x="1060" y="460" font-size="14" fill="#777975">Free</text>
    <text x="1288" y="460" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">171 GB</text>

    <rect x="814" y="487" width="496" height="1" fill="#deddd7"/>
    <text x="824" y="520" font-size="12" font-weight="650" letter-spacing="1.5" fill="#777975">TOP PROCESSES</text>
    <text x="824" y="555" font-size="15">Chrome</text><text x="1288" y="555" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#696b68">3.2 GB</text>
    <text x="824" y="585" font-size="15">Cursor</text><text x="1288" y="585" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#696b68">2.4 GB</text>
    <text x="824" y="615" font-size="15">node</text><text x="1288" y="615" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#696b68">1.1 GB</text>

    <rect x="790" y="646" width="544" height="1" fill="#deddd7"/>
    <rect x="1062" y="659" width="1" height="30" fill="#deddd7"/>
    <text x="926" y="681" text-anchor="middle" font-size="14" font-weight="550">◇  Make Room</text>
    <text x="1198" y="681" text-anchor="middle" font-size="14" font-weight="550">◉  Processes</text>
  </g>
</svg>
