name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild -project Room.xcodeproj -scheme Room \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            test
      - name: Verify universal binary
        run: |
          xcodebuild -project Room.xcodeproj -scheme Room \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            build
          lipo -info build/Build/Products/Debug/Room.app/Contents/MacOS/Room
          lipo -info build/Build/Products/Debug/Room.app/Contents/MacOS/Room | grep x86_64 | grep -q arm64
